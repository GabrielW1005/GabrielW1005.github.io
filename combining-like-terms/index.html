<script>
(() => {
  'use strict';

  const variables = Object.freeze({
    star: '☆', smile: '☺', tri: '△', square: '□', x: 'x', y: 'y', unit: '1'
  });
  const keys = Object.keys(variables);
  const groups = ['Picture terms', 'Two kinds of terms', 'Signed terms', 'Fractional terms'];

  const puzzle = (title, stage, left, right) => ({ title, group: groups[stage], left, right });
  const puzzles = [
    puzzle('Star stacks', 0,
      [['star', 2], ['star', 3]], [['star', 5]]),
    puzzle('Triangle count', 0,
      [['tri', 4], ['tri', 2]], [['tri', 5]]),
    puzzle('Shapes on the scale', 0,
      [['square', 2], ['tri', 3]], [['square', 5]]),
    puzzle('Where do the stars go?', 0,
      [['star', 3], ['smile', 2], ['star', 4]], [['star', 7], ['smile', 2]]),

    puzzle('Two smiling sides', 1,
      [['smile', 4], ['star', 3], ['smile', 1]], [['star', 1], ['smile', 5], ['star', 2]]),
    puzzle('Switch the shapes', 1,
      [['square', 2], ['tri', 5], ['square', 3]], [['tri', 2], ['square', 6], ['tri', 2]]),
    puzzle('Letters on the beam', 1,
      [['x', 3], ['y', 4], ['x', 5], ['y', 1]], [['y', 5], ['x', 8]]),
    puzzle('The extra number', 1,
      [['x', 3], ['unit', 2], ['x', 1]], [['x', 2], ['unit', 4]]),

    puzzle('Ghost stars', 2,
      [['star', 6], ['star', -4]], [['star', 2]]),
    puzzle('The missing squares', 2,
      [['square', 5], ['tri', -2], ['square', -3]], [['square', 2], ['tri', 2]]),
    puzzle('A zero pair', 2,
      [['smile', 3], ['star', -2], ['smile', -3]], [['star', -1], ['star', -1]]),
    puzzle('Signed letters', 2,
      [['x', 4], ['y', -3], ['x', -6]], [['y', -3], ['x', 2]]),

    puzzle('Parts of a star', 3,
      [['star', 1, 4], ['star', 2, 4]], [['star', 3, 4]]),
    puzzle('Halfway across', 3,
      [['tri', 1, 2], ['tri', 1, 4]], [['tri', 2, 6]]),
    puzzle('Common ground', 3,
      [['x', 2, 3], ['unit', 2], ['x', 1, 6]], [['unit', 2], ['x', 5, 6]]),
    puzzle('Signed pieces', 3,
      [['y', -3, 4], ['unit', 6], ['y', 1, 2], ['unit', -2]], [['y', -1, 4], ['unit', 4]]),
    puzzle('The final balance', 3,
      [['x', 3, 5], ['y', -2], ['x', -4, 5], ['y', 7]], [['y', 3], ['x', 1, 5], ['y', 2]])
  ];

  function gcd(a, b) {
    while (b !== 0) [a, b] = [b, a % b];
    return a;
  }

  function norm([key, n, d = 1]) {
    if (!Object.hasOwn(variables, key) || !Number.isSafeInteger(n) || !Number.isSafeInteger(d) || d === 0) {
      throw new TypeError('A term needs a known symbol and a valid rational coefficient.');
    }
    if (n === 0) return [key, 0, 1];
    const divisor = gcd(Math.abs(n), Math.abs(d));
    return [key, Math.sign(d) * n / divisor, Math.abs(d) / divisor];
  }

  function merge(a, b) {
    const [key, n, d] = norm(a);
    const [otherKey, m, e] = norm(b);
    if (key !== otherKey) throw new Error('Choose two terms with the same symbol.');
    return norm([key, n * e + m * d, d * e]);
  }

  function canonical(side) {
    const sums = new Map();
    for (const term of side) {
      const [key] = term;
      sums.set(key, sums.has(key) ? merge(sums.get(key), term) : norm(term));
    }
    return keys.map(key => sums.get(key)).filter(term => term && term[1] !== 0);
  }

  function equal(left, right) {
    const a = canonical(left);
    const b = canonical(right);
    return a.length === b.length && a.every(([key, n, d], i) =>
      b[i][0] === key && b[i][1] === n && b[i][2] === d
    );
  }

  function reduced(side) {
    const seen = new Set();
    for (const term of side) {
      const [key, n] = norm(term);
      if (n === 0 || seen.has(key)) return false;
      seen.add(key);
    }
    return true;
  }

  function evaluate(side, values) {
    let total = ['unit', 0, 1];
    for (const term of side) {
      const [key, n, d] = norm(term);
      total = merge(total, ['unit', n * (key === 'unit' ? 1 : values[key]), d]);
    }
    const [, n, d] = total;
    return d === 1 ? String(n) : n + '/' + d;
  }

  function witness(left, right) {
    if (equal(left, right)) return null;
    const used = Array.from(new Set([...left, ...right].map(term => term[0]))).filter(k => k !== 'unit');
    const values = Object.fromEntries(used.map(key => [key, 1]));
    function example() {
      const a = evaluate(left, values);
      const b = evaluate(right, values);
      return a !== b ? { values: { ...values }, left: a, right: b } : null;
    }
    // For unequal linear expressions, changing any coefficient that differs from
    // its counterpart must break a tie at the all-ones assignment.
    let result = example();
    for (const key of used) {
      if (result) break;
      values[key] = 2;
      result = example();
      values[key] = 1;
    }
    return result;
  }

  window.TermEngine = Object.freeze({ variables, groups, puzzles, norm, merge, canonical, equal, reduced, witness });
})();

</script><script>

    state={...s,left:s.left.map(t=>t.slice()),right:s.right.map(t=>t.slice()),selected:s.selected&&{...s.selected}};
  }
  window.TermBoard={mount,render,format:expressionText};
})();

</script><script>
(() => {
  'use strict';
  const E = window.TermEngine, B = window.TermBoard;
  const $ = id => document.getElementById(id);
  const storageKey = 'balance-lab.classroom.v1';
  const sides = ['left','right'];
  const names = {star:'star',smile:'smiley',tri:'triangle',square:'square',x:'x',y:'y',unit:'constant'};
  const icons = ['☆','x y','±','¼'];
  const icon = id => '<svg aria-hidden="true"><use href="#i-' + id + '"/></svg>';
  const defaultRecord = () => ({guess:null, moves:[]});
  let data;
  try { data = JSON.parse(localStorage.getItem(storageKey)); } catch {}
  if (!data || typeof data !== 'object' || !Array.isArray(data.records)) data = {records:[], completed:[], current:0, expanded:false};
  if (!Array.isArray(data.completed)) data.completed = [];
  data.completed = [...new Set(data.completed.filter(i => Number.isInteger(i) && E.puzzles[i]))];
  let current = Number.isInteger(data.current) && E.puzzles[data.current] ? data.current : 0;
  const hashIndex = Number(/^#puzzle-(\d+)$/.exec(window.location?.hash || '')?.[1]) - 1;
  if(Number.isInteger(hashIndex) && E.puzzles[hashIndex]) current = hashIndex;
  let testing = false;
  let p, state, r, selected = null, pair = null, phase, history, note = '', hintCount = 0;
  function persist() {
    data.current = current;
    try { localStorage.setItem(storageKey, JSON.stringify(data)); } catch {}
  }
  function rational(n,d=1) { return (n<0?'−':'')+Math.abs(n)+(d===1?'':'/'+d); }
  function termText(t, withSign=false) {
    const [key,n,d] = E.norm(t), sign = n<0?'−':withSign?'+':'';
    const number = key !== 'unit' && Math.abs(n)===1 && d===1 ? '' : rational(Math.abs(n),d);
    return sign+number+(key==='unit'?'':E.variables[key]);
  }
  function expression(terms) {
    return terms.length ? terms.map((t,i) => termText(t,i>0).replace(/^([+−])(.+)/,(_,s,v)=>s+' '+v)).join(' ').replace(/^− /,'−') : '0';
  }
  function applyMove(move) {
    if (!Array.isArray(move) || move.length!==3) return false;
    const [side, a, b] = move, terms = state[side];
    if (!sides.includes(side) || !Number.isInteger(a) || !Number.isInteger(b) || a>=b || !terms[a] || !terms[b] || terms[a][0]!==terms[b][0]) return false;
    const first=terms[a], second=terms[b], total=E.merge(first,second);
    const sumText=termText(first)+' '+(second[1]<0?'−':'+')+' '+termText([second[0],Math.abs(second[1]),second[2]]);
    history.push((side==='left'?'Left':'Right')+' pan · '+sumText+' = '+(total[1]===0?'0':termText(total)));
    terms.splice(b,1);
    if (total[1]===0) terms.splice(a,1);
    else terms[a]=total;
    return true;
  }
  function loadPuzzle(index) {
    current=index; testing=false; p=E.puzzles[index];
    if(window.history?.replaceState && (window.location.hash || index>0)) window.history.replaceState(null,'','#puzzle-'+(index+1));
    r=data.records[index];
    if (!r || ![true,false,null].includes(r.guess) || !Array.isArray(r.moves)) r=defaultRecord();
    data.records[index]=r;
    selected=null; pair=null; hintCount=0; note=''; history=[];
    state={left:p.left.map(E.norm),right:p.right.map(E.norm)};
    const valid=[];
    if(r.guess!==null) for(const move of r.moves){ if(!applyMove(move))break; valid.push(move); }
    r.moves=valid; settle(); paint();
  }
  function settle() {
    phase = r.guess===null?'predict':E.reduced(state.left)&&E.reduced(state.right)?'solved':'combine';
    if(phase==='solved' && !data.completed.includes(current)) data.completed.push(current);
    persist();
  }
  function message(text) { note=text; $('message').textContent=text; }
  function updateBoard() {
    B.render({...state,selected,testValues:testing ? E.witness(state.left,state.right) : null,expanded:!!data.expanded,phase,outcome:phase==='solved'?E.equal(state.left,state.right):null,onSelect:selectTerm});
    if(pair) {
      const pan=$('board').querySelectorAll('.tb-pan')[pair.side==='left'?0:1];
      const button=pan?.querySelectorAll('.tb-term')[pair.b];
      if(button) button.setAttribute('aria-pressed','true');
    }
  }
  function selectTerm(side,index) {
    if(phase!=='combine') return;
    const term=state[side][index]; if(!term)return;
    if(pair) {message('Enter the combined coefficient, or choose a different pair.');return;}
    if(!selected){selected={side,index};note='';}
    else if(selected.side===side && selected.index===index){selected=null;note='';}
    else if(selected.side!==side){message('Choose both terms on the same pan. Each pan is its own expression.');return;}
    else if(state[side][selected.index][0]!==term[0]){message('These terms have different symbols. Choose a term with the same symbol as the first.');return;}
    else {
      pair={side,a:selected.index,b:index};note='';hintCount=0;
    }
    paint();
    if(pair) $('coefficient').focus({preventScroll:true});
  }
  function findPair() {
    for(const side of sides) for(let a=0;a<state[side].length;a++) for(let b=a+1;b<state[side].length;b++) {
      if(state[side][a][0]===state[side][b][0]) return {side,a,b};
    }
  }
  function parseNumber(text) {
    const s=text.trim().replace(/−/g,'-').replace(/\s*\/\s*/g,'/');
    if(!s || s.length>23)return null;
    let n, d;
    if(/^[+-]?\d+\/[+-]?\d+$/.test(s)){[n,d]=s.split('/').map(Number);}
    else if(/^[+-]?(?:\d+\.?\d*|\.\d+)$/.test(s)){
      const digits=(s.split('.')[1]||'').length;d=10**digits;n=Number(s.replace('.',''));
    } else return null;
    if(!d||!Number.isSafeInteger(n)||!Number.isSafeInteger(d))return null;
    return E.norm(['unit',n,d]).slice(1);
  }
  function doMerge(ev) {
    ev.preventDefault();
    if(!pair)return;
    const {side,a,b}=pair, total=E.merge(state[side][a],state[side][b]), input=parseNumber($('coefficient').value);
    if (!input){message('Enter one number, such as −4 or 3/5.');return;}
    if(input[0]!==total[1]||input[1]!==total[2]){message('Try that sum again. Keep both signs. For fractions, use a common denominator.');return;}
    const move=[side,Math.min(a,b),Math.max(a,b)];r.moves.push(move);applyMove(move);
    note=total[1]===0?'Zero pair! The two matching terms cancel.':history[history.length-1];
    selected=null;pair=null;hintCount=0;settle();paint();
    if(phase==='solved') $('next')?.focus({preventScroll:true});
  }
  function hint(){
    const h=findPair();
    if(!h)return;
    if(pair){
      const a=state[pair.side][pair.a],b=state[pair.side][pair.b],d=a[2]*b[2]/gcd(a[2],b[2]);
      message(d===1?'Add the two signed numbers in front. Opposite signs can cancel.':'Use '+d+' as a common denominator. Add the signed numerators.');return;
    }
    if(!hintCount){message('Look for two '+names[state[h.side][h.a][0]]+' terms on the '+h.side+' pan.');hintCount++;return;}
    selected={side:h.side,index:h.a};note='One match is selected. Choose the other '+names[state[h.side][h.a][0]]+' term.';paint();
  }
  function gcd(a,b){while(b){[a,b]=[b,a%b]}return a;}
  function drawSide() {
    const i=phase==='predict'?0:phase==='combine'?1:2;
    $('phase-label').innerHTML=[0,1,2].map(n=>'<i class="'+(n<=i?'on':'')+'"></i>').join('')+'<span>'+['Predict','Combine','Result'][i]+'</span>';
    let html='';
    if(phase==='predict'){
      html='<h2>Your prediction</h2><p>Will the two pans have the same value for every possible value of each symbol?</p><div class="choices"><button id="yes" class="choice"><span class="mathicon">=</span><b>Always equal</b>'+icon('arrow')+'</button><button id="no" class="choice"><span class="mathicon">≠</span><b>Not always equal</b>'+icon('arrow')+'</button></div><div class="small-tip"><b>Try Rows</b> to count the pieces on each pan.</div>';
    }else if(phase==='combine'){
      html='<h2>'+(pair?'Add the coefficients':selected?'Find its match':'Make your proof')+'</h2>';
      if(pair){
        const a=state[pair.side][pair.a], b=state[pair.side][pair.b], key=a[0];
        html+='<p>Keep each sign as you add. A total of zero removes the pair.</p><div class="work-detail equation">'+rational(a[1],a[2])+' '+(b[1]<0?'−':'+')+' '+rational(Math.abs(b[1]),b[2])+' = ?</div><form id="merge" class="answer-form"><label for="coefficient">'+(key==='unit'?'New constant':'New coefficient of '+E.variables[key])+'</label><div class="answer-row"><input id="coefficient" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" maxlength="24" placeholder="e.g. 5 or −1/2"><button class="primary">Combine</button></div></form><button class="link-btn" id="change">Choose another pair</button>';
      }else html+='<p>'+(selected?'Choose another '+names[state[selected.side][selected.index][0]]+' term on the '+selected.side+' pan.':'Choose two terms with the same symbol on one pan. Combine all the like terms on both pans.')+'</p><div class="small-tip"><b>Your prediction</b> · '+(r.guess?'Always equal':'Not always equal')+'</div>';
      html+='<div><button id="hint" class="small-btn">'+icon('hint')+'Hint</button></div>';
    }else{
      const eq=E.equal(state.left,state.right);
      html='<h2>'+(eq?'Always equal!':'Not always equal')+'</h2><p>'+(eq?'Each symbol has the same total on both pans. The expressions match for every value.':'The simplified totals differ. One example is enough to show that equality can fail.')+'</p><div class="work-detail equation">'+expression(E.canonical(state.left))+' '+(eq?'=':' vs. ')+' '+expression(E.canonical(state.right))+'</div>';
      if(!eq){ const w=E.witness(state.left,state.right);const vals=Object.entries(w.values).map(([key,val])=>E.variables[key]+' = '+val).join(', ');html+='<p class="witness"><b>Test it.</b> '+(vals?'Set '+vals+'. ':'')+'Left = '+w.left+', right = '+w.right+'.<br><button id="test-values" class="link-btn">'+(testing?'Return to symbols':'Test these values on the beam')+'</button></p>'; }
      html+='<div class="result-line"><b>'+(r.guess===eq?'Your prediction was correct.':('Your prediction was “'+(r.guess?'always equal':'not always equal')+'.”'))+'</b></div><button id="next" class="primary">'+(current===E.puzzles.length-1?'Puzzle map':'Next puzzle')+icon('arrow')+'</button>';
    }
    if(history.length)html+='<div><button id="moves" class="link-btn">View moves ('+history.length+')</button></div>';
    $('panel').innerHTML=html;
    if(phase==='predict')for(const [id,choice] of [['yes',true],['no',false]]) $(id).onclick=()=>{r.guess=choice;note='';settle();paint();};
    if(phase==='combine'){
      $('hint').onclick=hint;
      if(pair){$('merge').onsubmit=doMerge;$('change').onclick=()=>{selected=null;pair=null;note='';paint();};}
    }
    if(phase==='solved')$('next').onclick=()=>current===E.puzzles.length-1?openMap():loadPuzzle(current+1);
    if(phase==='solved' && !E.equal(state.left,state.right))$('test-values').onclick=()=>{testing=!testing;paint();};
    if(history.length)$('moves').onclick=()=>openDialog('Your moves','<ol class="steps-log">'+history.map(s=>'<li>'+s+'</li>').join('')+'</ol>');
    $('message').textContent=note;
  }
  function paint(){
    $('puzzle-num').textContent='Puzzle '+String(current+1).padStart(2,'0')+' / '+E.puzzles.length;
    $('puzzle-title').textContent=p.title;
    $('count').textContent=data.completed.length+' / '+E.puzzles.length;
    $('ticks').innerHTML=E.puzzles.map((_,i)=>'<i class="'+(data.completed.includes(i)?'on':'')+'"></i>').join('');
    $('group').setAttribute('aria-pressed',String(!data.expanded));$('expand').setAttribute('aria-pressed',String(!!data.expanded));
    $('board-note').textContent=testing?'Testing the displayed values. The greater total tips down.':data.expanded?'Each piece is one copy or the labeled fraction.':(state.left.concat(state.right).some(t=>t[1]<0)?'Faded tiles with a minus sign are negative.':'Each tile shows a coefficient and its symbol.');
    $('undo').disabled=!r.moves.length && r.guess===null;
    $('reset').disabled=r.guess===null;
    $('stages').innerHTML=E.groups.map((g,i)=>{
      const items=E.puzzles.map((p,i)=>({p,i})).filter(o=>o.p.group===g),done=items.filter(o=>data.completed.includes(o.i)).length;
      return '<button class="stage" data-stage="'+i+'" aria-current="'+(p.group===g)+'"><span class="stage-icon" aria-hidden="true">'+icons[i]+'</span><span><b>'+g+'</b><small>'+done+' of '+items.length+' complete</small></span></button>';
    }).join('');
    updateBoard();drawSide();
  }
  function openDialog(title, html) {
    $('dialog-title').textContent=title;$('dialog-body').innerHTML=html;
    if(!$('dialog').open)$('dialog').showModal();
  }
  function openMap(stage=null){
    const html=E.groups.map((g,j)=>stage!==null&&j!==stage?'':'<section class="map-section"><h3>'+g+'</h3><div class="map-grid">'+E.puzzles.map((p,i)=>p.group!==g?'':'<button data-level="'+i+'" title="'+p.title+'" aria-label="Puzzle '+(i+1)+', '+p.title+(data.completed.includes(i)?', completed':'')+'" class="dialog-puzzle '+(i===current?'current ':'')+(data.completed.includes(i)?'done':'')+'">'+(i+1)+(data.completed.includes(i)?' ✓':'')+'</button>').join('')+'</div></section>').join('');
    openDialog(stage===null?'Puzzle map':E.groups[stage],(stage===null?'':'<p>Choose a puzzle in this set.</p>')+html);
  }
  $('map').onclick=$('all').onclick=()=>openMap();
  $('help').onclick=()=>openDialog('How to play','<ol class="howto"><li><b>Predict.</b> “Always equal” means the two sides agree for every value of the pictures and letters. The beam waits for your proof.</li><li><b>Count.</b> Switch to Rows to expand a coefficient into copies. Fraction tiles show equal-sized pieces of a symbol. Faded tiles with minus signs represent negative terms.</li><li><b>Combine.</b> Choose two matching terms on the same pan, then enter the sum of their coefficients. One positive and one negative copy cancel.</li><li><b>Check.</b> Reduce both pans. Compare their totals or try the example values to see why they differ.</li></ol>');
  $('stages').onclick=ev=>{const b=ev.target.closest('[data-stage]');if(b)openMap(Number(b.dataset.stage));};
  $('dialog-body').onclick=ev=>{const b=ev.target.closest('[data-level]');if(b){$('dialog').close();loadPuzzle(Number(b.dataset.level));}};
  $('close-dialog').onclick=()=>$('dialog').close();
  $('dialog').addEventListener('click',ev=>{if(ev.target===$('dialog')){const b=$('dialog').getBoundingClientRect();if(ev.clientX<b.left||ev.clientX>b.right||ev.clientY<b.top||ev.clientY>b.bottom)$('dialog').close();}});
  function setExpanded(v){if(!!data.expanded===v)return;data.expanded=v;persist();paint();}
  $('expand').onclick=()=>setExpanded(true);$('group').onclick=()=>setExpanded(false);
  $('undo').onclick=()=>{if(r.moves.length)r.moves.pop();else r.guess=null;loadPuzzle(current);message('Last move undone.');};
  $('reset').onclick=()=>{data.records[current]=defaultRecord();loadPuzzle(current);message('Puzzle restarted.');};
  function drawTheme(){const dark=data.theme==='dark';document.documentElement.classList.toggle('dark',dark);const label=dark?'Switch to light mode':'Switch to dark mode';$('theme').setAttribute('aria-label',label);$('theme').title=label;$('theme').innerHTML=icon(dark?'sun':'moon');}
  $('theme').onclick=()=>{data.theme=data.theme==='dark'?'light':'dark';drawTheme();persist();};
  B.mount($('board'));drawTheme();loadPuzzle(current);
})();

</script></body></html>
