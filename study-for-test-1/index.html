<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f5f3ee">
  <meta name="description" content="A Grade 7 study packet with geometry visualizations, saved practice, and lessons on circles, area, volume, and proportions.">
  <title>Study for Test 1</title>
  <link rel="stylesheet" href="./styles.css?v=8">
</head>
<body>
  <header class="app-header">
    <a class="brand" href="#lesson" aria-label="Study for Test 1 home"><span class="brand-mark" aria-hidden="true">∠</span><span>Study for Test 1<small>Geometry &amp; proportions</small></span></a>
    <nav class="view-tabs" aria-label="Study view">
      <button type="button" data-view="lesson" class="active">Lesson</button>
      <button type="button" data-view="packet">Virtual Packet</button>
      <button type="button" data-view="practice">More Practice</button>
    </nav>
    <div class="header-actions">
      <button id="contents-toggle" class="quiet-button" type="button" aria-haspopup="dialog">Contents</button>
      <button id="progress-toggle" class="quiet-button" type="button" aria-haspopup="dialog">Progress</button>
      <button id="solutions-toggle" class="quiet-button" type="button" aria-pressed="false" hidden>Example steps</button>
      <button id="theme-toggle" class="icon-button" type="button" title="Change color theme" aria-label="Switch to dark theme">◐</button>
      <button id="fullscreen-toggle" class="icon-button" type="button" title="Full screen" aria-label="Enter full screen">⛶</button>
      <button id="download-toggle" class="icon-button" type="button" aria-label="Download packet" title="Download packet" hidden>↓</button>
    </div>
  </header>
  <div id="download-menu" class="download-menu" hidden></div>
  <main id="app" aria-busy="true">
    <div class="loading-state"><div class="loading-line"></div><p>Opening your study packet…</p></div>
  </main>
  <footer class="app-footer"><span id="save-status">Answers stay on this browser.</span><button id="reset-progress" type="button">Reset saved answers</button></footer>
  <div id="toast" role="status" aria-live="polite"></div>
  <div id="advance-banner" class="advance-banner" role="status" aria-live="polite" hidden></div>
  <dialog id="study-dialog" class="study-dialog" aria-labelledby="dialog-title"><div id="dialog-content"></div><input id="restore-input" type="file" accept=".json,application/json" hidden></dialog>
  <noscript><p>Enable JavaScript to open the interactive study packet.</p></noscript>
  <script id="study-startup" data-bundle="./app.bundle-5d27abc15146.js">
    (function () {
      var startup = document.currentScript;
      var app = document.getElementById('app');
      var opened = false;
      var watchdog;
      function retry() {
        var url = new URL(window.location.href);
        url.searchParams.set('reload', Date.now().toString(36));
        window.location.replace(url.href);
      }
      function fail() {
        if (opened) return;
        clearTimeout(watchdog);
        app.setAttribute('aria-busy', 'false');
        app.innerHTML = '<section class="error-state"><h1>The packet did not finish opening.</h1><p>Try loading it again. Your saved answers will stay on this browser.</p><button type="button" class="primary-button" id="retry-packet">Try again</button></section>';
        document.getElementById('retry-packet').addEventListener('click', retry);
      }
      window.studyPacketBoot = {
        ready: function () { opened = true; clearTimeout(watchdog); },
        fail: fail
      };
      window.addEventListener('error', fail);
      watchdog = setTimeout(fail, 15000);
      var script = document.createElement('script');
      var url = new URL(startup.getAttribute('data-bundle'), window.location.href);
      var fresh = new URL(window.location.href).searchParams.get('reload');
      if (fresh) url.searchParams.set('retry', fresh);
      script.src = url.href;
      script.async = true;
      script.onerror = fail;
      document.body.appendChild(script);
    }());
  </script>
</body>
</html>
