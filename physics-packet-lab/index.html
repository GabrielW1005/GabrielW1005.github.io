<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#142c48">
<title>Motion Lab · Packet companion</title><meta name="description" content="A full-screen grade 8 science lab. Experiment with every packet problem, watch motion and forces, and use the graph to explain what happens.">
<link rel="stylesheet" href="styles.css?v=20261022-2">
</head>
<body>
<header class="topbar">
 <div class="brand"><span class="brandmark" aria-hidden="true">↗</span><strong>Motion Lab</strong><span class="grade-label">GRADE 8</span></div>
 <nav class="problem-navigation" aria-label="Packet navigation"><button id="problemsBtn" class="quiet">☰ <span id="problemCount">Problems</span></button><button id="prevBtn" class="quiet icon-button" aria-label="Previous problem">←</button><button id="nextBtn" class="quiet icon-button" aria-label="Next problem">→</button></nav>
 <div class="top-actions"><button id="helpBtn" class="quiet">Help & PDFs</button><button id="themeBtn" class="quiet icon-button" aria-label="Switch color theme" title="Switch color theme">◐</button><button id="fullBtn" class="quiet icon-button" aria-label="Enter fullscreen" title="Full screen">⛶</button></div>
</header>
<main class="workspace">
 <section class="problem-strip" aria-label="Current packet problem"><div class="problem-heading"><span class="eyebrow" id="eyebrow"></span><h1 id="problemTitle">Loading your lab…</h1><span id="settingsBadge" class="settings-badge">Packet values</span></div><div class="prompt-row"><p id="problemPrompt" class="problem-prompt"></p><button id="questionBtn" class="text-button">Full question ↗</button></div></section>
 <div class="lab-grid">
  <section class="stage-card" aria-label="Experiment">
   <div class="stage-toolbar"><span id="stageLabel">LIVE EXPERIMENT</span><div id="eventButtons" class="event-buttons"></div><label class="switch-label"><input id="vectorsToggle" type="checkbox" checked> Arrows</label><button id="notesBtn" class="text-button" title="Model assumptions">About this model</button></div>
   <div class="stage-surface"><canvas id="stage" aria-label="Physics simulation" role="img"></canvas><div id="targetBanner" class="target-banner hide"></div></div>
   <div id="readouts" class="readouts" aria-live="off"></div>
   <div class="transport"><button id="playBtn" class="primary">▶ Run</button><button id="restartBtn" class="icon-button" aria-label="Restart simulation" title="Restart simulation">↺</button><label class="time-control"><span id="timeLabel">0 s</span><input id="timeSlider" type="range" min="0" max="1000" value="0" aria-label="Simulation time"></label><select id="rateSelect" aria-label="Playback speed"><option value="0.25">¼×</option><option value="0.5">½×</option><option value="1" selected>1×</option><option value="2">2×</option><option value="4">4×</option></select></div>
  </section>
  <aside class="analysis-rail" aria-label="Graph and experiment controls">
   <section class="graph-wrap" id="graphWrap"><div class="graph-label"><span>GRAPH</span><select id="graphSelect" aria-label="Graph quantity"></select></div><canvas id="graph" role="img" aria-label="Graph of the experiment"></canvas></section>
   <div class="control-scroll">
    <section class="goal-card" aria-label="Problem goal"><div class="control-heading"><h2 id="goalHeading">Your goal</h2><button id="targetBtn" class="text-button">Set a target</button></div><div id="goalContent"></div><p id="feedback" class="feedback hide" role="status"></p></section>
    <section class="parameters-card" aria-label="Adjust experiment values"><div class="control-heading"><h2>Change the values</h2><button id="packetResetBtn" class="text-button" title="Restore the measurements in the packet">↺ Reset</button></div><div id="parameters"></div></section>
    <div class="rail-footer"><button id="stepsBtn" class="text-button">Explanation & steps ↗</button><button id="warmupBtn" class="text-button">Math warm-up ↗</button></div>
   </div>
  </aside>
 </div>
</main>
<dialog id="modal"><button id="closeModal" class="close-modal" aria-label="Close dialog">×</button><div id="modalContent"></div></dialog>
<script type="module" src="app.js?v=20261022-2"></script>
</body></html>
