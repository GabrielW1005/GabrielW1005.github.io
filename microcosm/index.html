<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#06141d"><meta name="description" content="Microcosm — a colorful microscopic survival and colony game grounded in organism-specific biology."><title>Microcosm · Living worlds</title><link rel="stylesheet" href="style.css?v=2.1.0"></head>
<body>
<canvas id="world" tabindex="0" aria-label="Microscopic world. Click your cells to select. Drag to select a group. Click elsewhere to move. WASD moves selected cells. Space uses abilities. R divides."></canvas>
<header><div class="brand"><span class="brand-symbol">◉</span><div>MICROCOSM<small>LIVING WORLDS <span>02</span></small></div></div><div class="vitals" id="vitals"><div class="vital" title="Membrane integrity"><span>♡</span><div><b id="hp">100</b><i><em id="hpBar"></em></i></div></div><div class="vital energy" title="Energy from food and respiration"><span>ϟ</span><div><b id="energy">90</b><i><em id="energyBar"></em></i></div></div><div class="vital mass" title="Biomass — reach 100 to divide"><span>◒</span><div><b id="mass">72</b><i><em id="massBar"></em></i></div></div></div><nav><button id="saveBtn" title="Save, download, or share a save link" aria-label="Saves">⇩<span id="saveDot"></span></button><button id="helpBtn" title="Controls and biology" aria-label="Controls and biology">?</button><button id="fullscreenBtn" title="Fullscreen" aria-label="Fullscreen">⛶</button><button id="pauseBtn" title="Pause (P)" aria-label="Pause">Ⅱ</button></nav></header>
<div class="habitat"><span id="habitatMark">✺</span><div id="habitatName">Algal garden</div><small id="environment">O₂ 100% · freshwater</small><button id="worldsBtn" title="Habitats and organisms" aria-label="Habitats and organisms">↗</button></div>
<div id="status" role="status" aria-live="polite"></div>
<div id="selectionInfo"><span id="cellName">Amoeba</span><small id="cellInfo">01 / 01</small></div>
<aside id="mapPanel"><div><span id="discovered">01 / 04</span><button id="labelsBtn" aria-label="Toggle labels" title="Labels">Aa</button></div><canvas id="map" width="240" height="168" aria-label="World map: click to look, double-click to send selected cells"></canvas><div class="mapControls"><button id="zoomOut" title="Zoom out" aria-label="Zoom out">−</button><button id="followBtn" title="Follow colony" aria-label="Follow colony">◎</button><button id="zoomIn" title="Zoom in" aria-label="Zoom in">+</button></div></aside>
<div id="colony" aria-label="Your colony"></div>
<div class="bottom"><div class="hint" id="hint">Click to move · WASD to steer · X to stop</div><div class="dock"><button id="abilityBtn" title="Cell ability (Space)" aria-label="Use cell ability"><strong id="abilityIcon">◉</strong><small id="abilityText">Engulf</small><kbd>SPACE</kbd></button><button id="divideBtn" title="Divide selected cells (R)" aria-label="Divide selected cells"><strong>◉◉</strong><small>Divide</small><kbd>R</kbd><i id="divisionProgress"></i></button><button id="mutateBtn" title="Heritable variants (G)" aria-label="Heritable variants"><strong>⧖</strong><small>Variants</small><span class="badge" id="points">2</span><kbd>G</kbd></button><div class="dock-sep"></div><button id="stopBtn" title="Stop selected cells (X)" aria-label="Stop selected cells"><strong>■</strong><small>Stop</small><kbd>X</kbd></button><button id="allBtn" title="Select entire colony (Q)" aria-label="Select entire colony"><strong>⁙</strong><small>All cells</small><kbd>Q</kbd></button><button id="modeBtn" title="Toggle foraging for unselected colony cells" aria-label="Toggle autonomous foraging"><strong>⌁</strong><small id="modeText">Hold</small></button><button id="autoBtn" title="Toggle automatic abilities" aria-pressed="false"><strong>✳</strong><small>Auto</small></button><button id="speedBtn" title="Simulation speed" aria-label="Simulation speed"><strong id="speedValue">1×</strong><small>Speed</small></button><button id="competenceBtn" hidden title="Toggle DNA competence (E)" aria-label="Toggle DNA competence"><strong>⇥</strong><small>DNA uptake</small><kbd>E</kbd></button><button id="mateBtn" hidden title="Pair two selected Paramecia (Z)" aria-label="Conjugate selected cells"><strong>∞</strong><small>Pair</small><kbd>Z</kbd></button></div></div>
<div id="pauseOverlay" hidden><div><span>Ⅱ</span><h2>Life, paused.</h2><button id="resumeBtn" class="primary">Continue →</button></div></div>
<div id="modalRoot"></div><input type="file" id="importFile" accept=".json,application/json" hidden>
<script src="engine.js?v=2.1.0"></script><script src="render.js?v=2.1.0"></script><script src="app.js?v=2.1.0"></script>
</body></html>
